<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <rect width="1200" height="820" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold">Testaufbau Vorschalt-Becherkondensatoren (ohne Platine)</text>
  <text x="30" y="64" fill="#555">Ziel: passende µF-Werte für Stufe 1 und 2 finden. Becherkondensatoren nur im spannungsfreien, entladenen Zustand tauschen.</text>

  <!-- Netz -->
  <rect x="30" y="160" width="150" height="380" rx="10" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="105" y="190" text-anchor="middle" font-weight="bold">Netz 230 V</text>
  <text x="105" y="210" text-anchor="middle" fill="#555">Schuko-Stecker /</text>
  <text x="105" y="228" text-anchor="middle" fill="#555">Verlängerung</text>
  <text x="168" y="270" text-anchor="end" font-weight="bold" fill="#8b4513">L</text>
  <text x="168" y="463" text-anchor="end" font-weight="bold" fill="#1e5aa8">N</text>
  <text x="168" y="513" text-anchor="end" font-weight="bold" fill="#2e8b2e">PE</text>

  <!-- Gehäuse -->
  <rect x="215" y="100" width="660" height="480" rx="12" fill="none" stroke="#e08a00" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="232" y="126" font-weight="bold" fill="#e08a00">Geschlossenes Gehäuse (CRDCG0007, 190 × 120 × 60 mm – später für die Platine)</text>

  <!-- L Netz -> Wago A -->
  <line x1="180" y1="265" x2="280" y2="265" stroke="#8b4513" stroke-width="4"/>

  <!-- Wago A / B -->
  <rect x="280" y="200" width="60" height="130" rx="6" fill="#ffb000" stroke="#333" stroke-width="2"/>
  <text x="310" y="352" text-anchor="middle" font-weight="bold">Wago A</text>
  <text x="310" y="370" text-anchor="middle" fill="#555" font-size="13">221-415, L vom Netz</text>
  <rect x="660" y="200" width="60" height="130" rx="6" fill="#ffb000" stroke="#333" stroke-width="2"/>
  <text x="690" y="352" text-anchor="middle" font-weight="bold">Wago B</text>
  <text x="690" y="370" text-anchor="middle" fill="#555" font-size="13">221-415, L zum Motor</text>

  <!-- C1 mit Entladewiderstand -->
  <g stroke="#333" stroke-width="3" fill="none">
    <line x1="340" y1="230" x2="488" y2="230"/><line x1="512" y1="230" x2="660" y2="230"/>
    <line x1="488" y1="214" x2="488" y2="246"/><line x1="512" y1="214" x2="512" y2="246"/>
  </g>
  <text x="535" y="252" font-weight="bold">C1</text>
  <g stroke="#7a2a9a" stroke-width="2" fill="none">
    <polyline points="400,230 400,180 470,180"/><rect x="470" y="172" width="60" height="16" fill="#f2e6f8"/><polyline points="530,180 600,180 600,230"/>
  </g>
  <text x="500" y="164" text-anchor="middle" fill="#7a2a9a" font-size="13">470 kΩ Entladewiderstand (je Becherkondensator)</text>

  <!-- C2 optional parallel -->
  <g stroke="#333" stroke-width="3" fill="none">
    <line x1="340" y1="295" x2="488" y2="295"/><line x1="512" y1="295" x2="660" y2="295"/>
    <line x1="488" y1="279" x2="488" y2="311"/><line x1="512" y1="279" x2="512" y2="311"/>
  </g>
  <text x="535" y="317" font-weight="bold">C2 <tspan font-weight="normal" fill="#555">(optional)</tspan></text>

  <!-- Brücke -->
  <path d="M340 322 C 430 345, 570 345, 660 322" fill="none" stroke="#c00" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="500" y="395" text-anchor="middle" fill="#c00" font-size="14">rot gestrichelt: Brücke statt Kondensator = Vollgas-Vergleich</text>

  <!-- N / PE unterhalb, eigene Wagos -->
  <line x1="180" y1="458" x2="760" y2="458" stroke="#1e5aa8" stroke-width="4"/>
  <line x1="180" y1="508" x2="760" y2="508" stroke="#2e8b2e" stroke-width="4"/>
  <rect x="760" y="440" width="54" height="36" rx="5" fill="#ffb000" stroke="#333" stroke-width="2"/>
  <text x="787" y="463" text-anchor="middle" font-size="13">N</text>
  <rect x="760" y="490" width="54" height="36" rx="5" fill="#ffb000" stroke="#333" stroke-width="2"/>
  <text x="787" y="513" text-anchor="middle" font-size="13">PE</text>
  <text x="787" y="548" text-anchor="middle" fill="#555" font-size="13">2 × 221-413</text>

  <!-- zum Motor -->
  <line x1="720" y1="265" x2="960" y2="265" stroke="#1e6fd8" stroke-width="4"/>
  <line x1="814" y1="458" x2="960" y2="458" stroke="#111" stroke-width="4"/>
  <line x1="814" y1="508" x2="960" y2="508" stroke="#2e8b2e" stroke-width="5"/>
  <line x1="814" y1="508" x2="960" y2="508" stroke="#e0cc00" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- Messpunkte -->
  <circle cx="810" cy="265" r="20" fill="none" stroke="#0a8" stroke-width="3"/>
  <text x="810" y="302" text-anchor="middle" fill="#0a8" font-size="13">Stromzange um blau</text>
  <text x="1065" y="420" text-anchor="middle" fill="#0a8" font-size="13">U Motor messen:</text>
  <text x="1065" y="436" text-anchor="middle" fill="#0a8" font-size="13">blau – schwarz</text>
  <text x="500" y="420" text-anchor="middle" fill="#0a8" font-size="13">U Kondensator: Wago A – Wago B (Multimeter)</text>

  <!-- Motor -->
  <rect x="960" y="190" width="210" height="370" rx="14" fill="#eef3f8" stroke="#333" stroke-width="2"/>
  <text x="1065" y="218" text-anchor="middle" font-weight="bold">Motor Gutmann</text>
  <text x="1065" y="238" text-anchor="middle" fill="#555" font-size="13">109942-00 · 260 W · 1,15 A</text>
  <text x="975" y="260" font-size="14" fill="#1e6fd8">blau (L)</text>
  <text x="975" y="453" font-size="14">schwarz (N)</text>
  <text x="975" y="503" font-size="14" fill="#2e8b2e">gelb/grün (PE)</text>
  <rect x="995" y="320" width="140" height="70" rx="8" fill="#ffffff" stroke="#777"/>
  <text x="1065" y="344" text-anchor="middle" font-size="13">Betriebskond. 6,5 µF</text>
  <text x="1065" y="362" text-anchor="middle" font-size="13">schwarz – braun</text>
  <text x="1065" y="380" text-anchor="middle" font-size="12" fill="#777">bleibt unverändert</text>

  <!-- Unten: Kombinationen + Sicherheit -->
  <text x="30" y="630" font-weight="bold">Kombinationen aus 6 / 8 / 12 µF</text>
  <g font-size="14">
    <text x="30" y="654">6 · 8 · 12 · 6+8 = 14 · 6+12 = 18 · 8+12 = 20 · alle = 26 µF</text>
    <text x="30" y="684" font-weight="bold">Erwartung (grob gerechnet)</text>
    <text x="30" y="706">Stufe 2 ≈ 15–20 µF → ~0,8–0,9 A</text>
    <text x="30" y="726">Stufe 1 ≈ 10–12 µF → ~0,6 A</text>
    <text x="30" y="746">Vollgas (Brücke) → 1,15 A</text>
    <text x="30" y="776" fill="#555">Start mit 14 µF, dann kleiner/größer, bis der Motor ruhig und sicher läuft.</text>
  </g>
  <text x="640" y="630" font-weight="bold" fill="#c00">Sicherheit</text>
  <g font-size="14" fill="#333">
    <text x="640" y="654">• Tauschen nur bei gezogenem Stecker</text>
    <text x="640" y="676">• Becherkondensator kann bis 325 V halten: 30 s warten</text>
    <text x="654" y="694">(470 kΩ entlädt), dann 0 V messen</text>
    <text x="640" y="716">• Gehäuse im Betrieb geschlossen (Sicherheitsklasse S0)</text>
    <text x="640" y="738">• Kleinste Stufe 15 min laufen lassen, Motortemperatur prüfen</text>
    <text x="640" y="760">• Absicherung: Leitungsschutzschalter + Thermowächter im Motor</text>
  </g>
</svg>
