# ---------------------------------------------------------------------------
# Dunstabzugshaube – Testkonfiguration Motorsteuerung, Variante A
# (Relais + Vorschaltkondensatoren)
#
# Schritt 1: Nur K1 (Boost) bestückt  -> ersetzt den bisherigen Schalter,
#            Motor läuft an/aus mit voller Drehzahl. In HA Stufe 4 wählen.
# Schritt 2: K2–K4 mit Vorschaltkondensatoren CM1–CM3 nachrüsten -> Stufen 1–3.
#
# Belegung (alle Relais schalten L zum Motoranschluss, siehe Doku Abschnitt 3):
#   Stufe 1 -> K2 (über CM1, kleinster Kondensator = langsamste Stufe)
#   Stufe 2 -> K3 (über CM2)
#   Stufe 3 -> K4 (über CM3)
#   Stufe 4 -> K1 (direkt, Boost)
#
# Sicherheitslogik:
#   - Nie zwei Relais gleichzeitig (Script schaltet erst alle aus, dann Pause)
#   - Relais sind intern, HA sieht nur den Lüfter und kann sie nicht einzeln schalten
#   - Start immer mit Anlauf-Boost, danach Wechsel in die Zielstufe
#   - Nach Neustart alles aus
#
# Der 230-V-Teil wird von einer Elektrofachkraft aufgebaut und geprüft.
# Stand: 23.11.2026 (Temperatur J6 + WLAN-Signal ergänzt), ungetestet auf Hardware
# ---------------------------------------------------------------------------

substitutions:
  device_name: dunstabzug-motor-test
  # ESP32-Pins ohne Boot-Sonderfunktion
  pin_k1_boost: GPIO16
  pin_k2_stufe1: GPIO17
  pin_k3_stufe2: GPIO18
  pin_k4_stufe3: GPIO19
  pin_onewire: GPIO4        # J6, DS18B20 (Pull-up R10 4,7 kΩ auf der Platine)
  temp_warnung: "60"        # °C im Aufnahmeraum, ab hier Warnung in HA
  # Viele Relaismodule schalten bei LOW -> "true". Bei HIGH-aktiven Modulen "false".
  relais_invertiert: "true"
  umschaltpause: 300ms      # alle Relais aus, bevor ein anderes einschaltet
  anlauf_dauer: 2s          # Boost beim Start aus dem Stillstand

esphome:
  name: ${device_name}
  friendly_name: Dunstabzug Motor Test
  on_boot:
    priority: 600           # früh: Relais sicher aus
    then:
      - script.execute:
          id: set_motor
          stufe: 0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  ap:
    ssid: "${device_name} Fallback"

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# ---------------------------------------------------------------------------
# Relais (intern, nur über das Script schaltbar)
# ---------------------------------------------------------------------------
switch:
  - platform: gpio
    id: k1_boost
    pin:
      number: ${pin_k1_boost}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: &relais_gruppe [k1_boost, k2_stufe1, k3_stufe2, k4_stufe3]
    interlock_wait_time: ${umschaltpause}

  - platform: gpio
    id: k2_stufe1
    pin:
      number: ${pin_k2_stufe1}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: *relais_gruppe
    interlock_wait_time: ${umschaltpause}

  - platform: gpio
    id: k3_stufe2
    pin:
      number: ${pin_k3_stufe2}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: *relais_gruppe
    interlock_wait_time: ${umschaltpause}

  - platform: gpio
    id: k4_stufe3
    pin:
      number: ${pin_k4_stufe3}
      inverted: ${relais_invertiert}
    restore_mode: ALWAYS_OFF
    internal: true
    interlock: *relais_gruppe
    interlock_wait_time: ${umschaltpause}

globals:
  - id: motor_laeuft
    type: bool
    restore_value: no
    initial_value: "false"
  - id: aktuelle_stufe
    type: int
    restore_value: no
    initial_value: "0"

# ---------------------------------------------------------------------------
# Umschaltlogik
# ---------------------------------------------------------------------------
script:
  - id: set_motor
    mode: restart           # neuester Befehl gewinnt; jeder Lauf beginnt mit "alles aus"
    parameters:
      stufe: int
    then:
      - switch.turn_off: k1_boost
      - switch.turn_off: k2_stufe1
      - switch.turn_off: k3_stufe2
      - switch.turn_off: k4_stufe3
      - if:
          condition:
            lambda: "return stufe <= 0;"
          then:
            - lambda: "id(motor_laeuft) = false;"
            - logger.log: "Motor aus"
          else:
            - delay: ${umschaltpause}
            # Anlauf: aus dem Stillstand in eine Teilstufe -> erst kurz Boost
            - if:
                condition:
                  lambda: "return !id(motor_laeuft) && stufe < 4;"
                then:
                  - logger.log: "Anlauf mit Boost"
                  - switch.turn_on: k1_boost
                  - lambda: "id(motor_laeuft) = true;"
                  - delay: ${anlauf_dauer}
                  - switch.turn_off: k1_boost
                  - delay: ${umschaltpause}
            - lambda: |-
                id(motor_laeuft) = true;
                ESP_LOGI("motor", "Stufe %d", stufe);
                switch (stufe) {
                  case 1: id(k2_stufe1).turn_on(); break;
                  case 2: id(k3_stufe2).turn_on(); break;
                  case 3: id(k4_stufe3).turn_on(); break;
                  default: id(k1_boost).turn_on(); break;
                }

# ---------------------------------------------------------------------------
# Lüfter für Home Assistant
# ---------------------------------------------------------------------------
fan:
  - platform: template
    id: hood_fan
    name: "Lüfter"
    speed_count: 4          # 1–3 = Stufen, 4 = Boost
    restore_mode: ALWAYS_OFF
    on_state:
      # Nur bei echter Änderung umschalten, sonst würde jeder erneute
      # Statusbefehl den Motor kurz aus- und wieder einschalten.
      - if:
          condition:
            lambda: |-
              int ziel = id(hood_fan).state ? id(hood_fan).speed : 0;
              return ziel != id(aktuelle_stufe);
          then:
            - lambda: "id(aktuelle_stufe) = id(hood_fan).state ? id(hood_fan).speed : 0;"
            - script.execute:
                id: set_motor
                stufe: !lambda "return id(aktuelle_stufe);"

# ---------------------------------------------------------------------------
# Diagnose
# ---------------------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: ${pin_onewire}

sensor:
  - platform: dallas_temp
    id: temp_raum
    name: "Temperatur Aufnahmeraum"
    update_interval: 30s
  - platform: wifi_signal     # Empfang im Edelstahlraum: > -70 dBm gut, < -80 dBm Antenne nach außen
    name: "WLAN Signal"
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "Übertemperatur Aufnahmeraum"
    device_class: heat
    # 5 K Hysterese, damit die Meldung nicht flattert
    lambda: |-
      static bool warm = false;
      float t = id(temp_raum).state;
      if (isnan(t)) return {};
      if (t >= ${temp_warnung}) warm = true;
      else if (t <= ${temp_warnung} - 5) warm = false;
      return warm;

text_sensor:
  - platform: template
    name: "Motor Relais"
    update_interval: 1s
    lambda: |-
      if (id(k1_boost).state)  return {"K1 Boost"};
      if (id(k2_stufe1).state) return {"K2 Stufe 1"};
      if (id(k3_stufe2).state) return {"K3 Stufe 2"};
      if (id(k4_stufe3).state) return {"K4 Stufe 3"};
      return {"aus"};
